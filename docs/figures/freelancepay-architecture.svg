<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">FreelancePay implementation architecture</title>
  <desc id="description">The browser requests wallet permission and signing from MetaMask. MetaMask submits transactions to the FreelancePay contract on Ethereum Sepolia. Separately, the browser uses the read-only Flask API, which queries the chain through an RPC gateway. The contract validates payer, amount and invoice state and transfers an exact payment atomically to the invoice issuer. Flask does not hold wallet signing keys.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#166b5d"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #16312c; }
      .heading { font-size: 30px; font-weight: 700; }
      .body { font-size: 24px; }
      .small { font-size: 22px; }
      .node { fill: #ffffff; stroke: #62867e; stroke-width: 2; }
      .line { fill: none; stroke: #166b5d; stroke-width: 3; marker-end: url(#arrow); }
      .read { marker-start: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#f6faf8"/>
  <text x="40" y="48" class="heading">FreelancePay: implementation architecture</text>
  <rect x="30" y="80" width="325" height="465" rx="18" fill="#e9f1ed"/>
  <text x="48" y="110" class="small">Presentation and public API</text>
  <rect x="40" y="130" width="300" height="165" rx="12" class="node"/>
  <text x="60" y="170" class="heading">Browser</text>
  <text x="60" y="204" class="small">HTML · CSS · JavaScript</text>
  <text x="60" y="236" class="body">Review and status</text>
  <text x="60" y="267" class="body">ethers library</text>
  <rect x="450" y="130" width="280" height="165" rx="12" class="node"/>
  <text x="470" y="170" class="heading">MetaMask</text>
  <text x="470" y="204" class="body">Account permission</text>
  <text x="470" y="236" class="body">Local signing</text>
  <text x="470" y="267" class="body">Wallet RPC</text>
  <path d="M340 222 H450" class="line read"/>
  <text x="363" y="207" class="small">Wallet</text>
  <rect x="830" y="130" width="340" height="310" rx="12" fill="#e0f0e9" stroke="#166b5d" stroke-width="2"/>
  <text x="850" y="170" class="heading" style="font-size:27px">FreelancePay contract</text>
  <text x="850" y="204" class="body">Ethereum Sepolia</text>
  <text x="850" y="243" class="small">Caller / amount / state rules</text>
  <text x="850" y="284" class="body">Pending → Paid</text>
  <text x="850" y="316" class="body">or Cancelled</text>
  <text x="850" y="363" class="body">State and events</text>
  <text x="850" y="404" class="body">Atomic payment transfer</text>
  <path d="M730 222 H830" class="line"/>
  <text x="744" y="207" class="small">Writes</text>
  <rect x="40" y="380" width="300" height="150" rx="12" class="node"/>
  <text x="60" y="417" class="heading">Flask API</text>
  <text x="60" y="450" class="body">Config and readiness</text>
  <text x="60" y="482" class="body">Invoices and history</text>
  <text x="60" y="513" class="body">Receipt checks</text>
  <path d="M190 295 V380" class="line read"/>
  <text x="207" y="344" class="small">HTTP GET</text>
  <rect x="450" y="380" width="280" height="150" rx="12" class="node"/>
  <text x="470" y="417" class="heading">RPC gateway</text>
  <text x="470" y="456" class="body">Public chain reads</text>
  <text x="470" y="493" class="body">Upstream dependency</text>
  <path d="M340 455 H450" class="line read"/>
  <text x="372" y="440" class="small">RPC</text>
  <path d="M730 455 H785 V350 H830" class="line read"/>
  <text x="749" y="337" class="small">Read</text>
  <rect x="830" y="505" width="340" height="78" rx="12" class="node"/>
  <text x="850" y="538" class="heading">Invoice issuer</text>
  <text x="850" y="569" class="body">Receives exact payment</text>
  <path d="M1000 440 V505" class="line"/>
  <text x="1018" y="480" class="small">Exact ETH</text>
  <text x="40" y="618" class="small">Public reads do not authorize payment. Keys stay in MetaMask; invoice state and events stay on-chain.</text>
</svg>
